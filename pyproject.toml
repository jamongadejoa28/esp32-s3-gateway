    "esp-idf-monitor>=1.10.0",
    "esp-idf-nvs-partition-gen~=0.1.9",
    "esp-idf-panic-decoder>=1.5.0",
    "esp-idf-sbom>=1.4.0",
    "esp-idf-size>=2.3.2",
    "esptool>=5.5.0",
    "freertos-gdb>=1.0.4",
    "idf-component-manager>=2.2",
    "idf-drivers-gdb>=0.1.1",
    "jsonschema>=4.23",
    "littlefs-python==0.19.0",
    "ninja>=1.13.2",
    "packaging>=26.3",
    "psutil>=7.0.0",
    "pyclang>=0.7.0",
    "pyelftools>=0.33",
